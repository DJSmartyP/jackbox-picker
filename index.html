<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#070812" />
  <meta name="description" content="Unofficial Jackbox Games Picker made by Partycipate." />
  <meta property="og:title" content="Jackbox Games Picker — Made by Partycipate" />
  <meta property="og:description" content="Browse, filter and choose a Jackbox game with an unofficial picker made by Partycipate." />
  <meta property="og:image" content="assets/social-preview.png" />
  <title>Jackbox Games Picker — Made by Partycipate</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-orb orb-a"></div><div class="bg-orb orb-b"></div><div class="bg-orb orb-c"></div>
  <header class="topbar">
    <button class="brand" data-view="home" aria-label="Jackbox Games Picker home">
      <img class="brand-mark-original" src="assets/partycipate-mark-original.png" alt="" aria-hidden="true" />
      <img class="brand-wordmark-original" src="assets/partycipate-wordmark-original.png" alt="Partycipate" />
    </button>
    <nav class="desktop-nav" aria-label="Main navigation">
      <button data-view="games">Games</button>
      <button data-view="packs">Packs</button>
      <button data-view="finder">Find a Game</button>
      <button class="wheel-nav" data-view="wheel">Wheel</button>
    </nav>
    <button id="settingsBtn" class="icon-btn" aria-label="Open preferences">⚙</button>
  </header>

  <main id="app" class="app-shell"></main>

  <nav class="mobile-nav" aria-label="Mobile navigation">
    <button data-view="home"><span>⌂</span>Home</button>
    <button data-view="games"><span>▦</span>Games</button>
    <button data-view="finder"><span>⌕</span>Find</button>
    <button data-view="wheel"><span>◉</span>Wheel</button>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <dialog id="gameDialog" class="dialog"></dialog>
  <dialog id="settingsDialog" class="dialog"></dialog>

  <script src="data/catalogue.js"></script>
  <script src="app.js"></script>
</body>
</html>
